# XcodeGen 工程描述：`make xcodeproj` 生成 Statly.xcodeproj（生成物不入库）。
# 逻辑代码仍在 Sources/ 下，SPM（Package.swift）继续负责 swift test。
name: Statly
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
targets:
  Statly:
    type: application
    platform: macOS
    sources:
      - Sources/Statly
      - Sources/StatlyKit
      - Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Statly
        CFBundleDisplayName: Statly
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.statly.app
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
